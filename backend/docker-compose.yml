services:

  postgres:
    image: postgres:16-alpine
    container_name: icc-uvv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3

  qlever:
    image: adfreiburg/qlever:latest
    container_name: icc-uvv-qlever
    restart: unless-stopped
    working_dir: /data
    environment:
      UID: "999"
      GID: "999"
    command: ["-c", "if [ -f icc_uvv.meta-data.json ]; then qlever start --run-in-foreground --persist-updates; else qlever index && qlever start --run-in-foreground --persist-updates; fi"]
    ports:
      - "7011:7011"
    volumes:
      - qlever_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  qlever_data:
